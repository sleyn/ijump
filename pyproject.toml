[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ijump"
version = "1.0.4"
description = "Search for Insertion Sequence (IS) rearrangements in evolved population sequencing data."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "pandas",
    "pysam",
    "pysamstats",
    "biopython",
    "numpy",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
