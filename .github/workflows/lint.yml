name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pyproject.toml's `requires-python` floor (>=3.7) predates the
          # Python the project actually runs/type-checks under today
          # (environment.yml pins 3.11; ticket 06 found mypy 2.3.1 refuses
          # python_version < 3.10). Use 3.11 to match the environment the
          # ruff/mypy baseline in ticket 06 was actually verified against.
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          # `pip install .[lint]` would also try to build the project's
          # core runtime deps (pysam/pysamstats), which ticket 03 found
          # cannot be resolved/built via pip or uv on a current Python/CI
          # image (pysamstats 1.1.2 hard-pins an unbuildable pysam==0.15.4).
          # Neither ruff nor mypy need ijump's runtime deps installed to
          # lint/type-check the source tree (mypy's `ignore_missing_imports`
          # covers the untyped ones), so install the pinned `lint` extra's
          # tools directly instead of `pip install -e .[lint]`.
          python -m pip install ruff==0.16.3 mypy==2.3.1

      # Scoped to src/ijump/: ticket 06 established a clean ruff/mypy
      # baseline only for that directory (tests/ and other non-package
      # directories were out of scope there and are not yet clean).
      - name: ruff check
        run: ruff check src/ijump

      - name: ruff format --check
        run: ruff format --check src/ijump

      - name: mypy
        run: mypy src/ijump

      # No pytest step here on purpose: this repo's test suite needs
      # BLAST+ and pysamstats (a compiled, conda-only dependency), and
      # there is no known-good CI install recipe for those yet - see
      # tickets 03 (uv)/04 (conda)/05 (Docker). Adding a `pytest` step is
      # deferred to a future ticket once one of those provides a reusable
      # dependency-install recipe for CI.
